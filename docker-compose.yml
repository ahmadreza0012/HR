services:
  postgres:
    image: postgres:16-alpine
    container_name: kara-payroll-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kara_payroll
      POSTGRES_USER: kara
      POSTGRES_PASSWORD: kara
    ports: ["5432:5432"]
    volumes: ["kara_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kara -d kara_payroll"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  kara_postgres_data:
