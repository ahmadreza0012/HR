services:
  - type: web
    name: kara-payroll-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm run dev:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DATABASE_URL
        fromDatabase:
          name: kara-payroll-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false

databases:
  - name: kara-payroll-db
    plan: free
